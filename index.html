<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>BMY Groove Lab</title>
<style>
/* VOICE: a workbench beside BMY Drummer — dark stage, BMY's lane colours, nothing decorative.
   IDEA: an editor's timeline above, BMY's own grid below.
   PICTURE: the song's waveform with bar lines, and the 12-lane pattern grid.
   COLOUR/TYPE: BMY stage black, lane colours from BMY_ColorTheme, system sans.
   LAYOUT: top half timeline + transport, bottom half pattern tabs + grid + export. */
:root{color-scheme:dark;--bg:#000;--panel:#0d0e12;--panel2:#15171d;--line:#2a2d36;--ink:#f1f2f5;--dim:#8d929e;--acc:#ffad14;--sel:rgba(255,173,20,.16);--mark:rgba(38,199,255,.18);--markEdge:#26c7ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{display:flex;flex-direction:column;height:100%;}
.top{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:8px 10px 6px;border-bottom:1px solid var(--line)}
.bottom{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:6px 10px 8px;gap:6px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grow{flex:1 1 auto}
button,.btn,select,input{font:inherit;color:var(--ink)}
button,.btn{min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
button.primary{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
button.on{background:#2b2f3a;border-color:#6b7385}
button:disabled{opacity:.35}
#lock[aria-pressed=true]{background:#26c7ff;border-color:#26c7ff;color:#000;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:1px}
input[type=number],input[type=text],select{min-height:40px;border-radius:10px;border:1px solid var(--line);background:#000;padding:0 10px;font-size:16px}
input[type=number]{width:96px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.on{background:#2b2f3a}
.label{color:var(--dim);font-size:13px}
.mixer{display:inline-flex;flex-wrap:wrap;gap:6px}
.ch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:0 8px 0 0;background:var(--panel)}
.ch button{border:0;border-right:1px solid var(--line);border-radius:10px 0 0 10px;min-width:70px;color:var(--dim)}
.ch button[aria-pressed=true]{color:#000;background:var(--chc,#9aa3b5);font-weight:600}
#ch-drums{--chc:#ec8a2c}#ch-pattern{--chc:#26c7ff}
.ch input[type=range]{width:clamp(56px,6vw,96px);height:40px;accent-color:var(--acc);margin:0}
.title{font-weight:600;font-size:17px;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#overview{height:34px;width:100%;display:block;background:var(--panel);border-radius:8px;touch-action:none}
#detail{position:relative;background:var(--panel);border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#detail canvas{display:block;width:100%}
#ruler{height:30px}
#wMix,#wDrums{height:clamp(56px,11vh,110px)}
.tracklabel{position:absolute;left:8px;font-size:12px;color:var(--dim);pointer-events:none;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
#status{font-size:13px;color:var(--dim);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:4px;background:#1d2028;border-radius:3px;overflow:hidden}.prog>i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none}
.tabs button.on{border-color:var(--markEdge);background:#0f2a35}
#gridWrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#000;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 4px}
#grid{flex:1 1 auto;display:grid;grid-template-rows:repeat(12,minmax(0,1fr));gap:3px;min-height:0}
.row{display:grid;grid-template-columns:44px repeat(16,minmax(0,1fr));gap:2px;position:relative;min-height:0}
.glyph{display:flex;align-items:center;justify-content:center}
.glyph svg{width:30px;height:30px;max-height:100%}
.cell{position:relative;border-radius:4px;background:#131418;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:0}
.cell.beat{background:#1b1d23}
.cell.cov{background:#101822}
.note{position:absolute;border-radius:22%;pointer-events:none}
.trip{position:absolute;top:50%;border-radius:22%;transform:translate(-50%,-50%);pointer-events:none}
.gridinfo{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:6px;font-size:13px;color:var(--dim)}
.gridinfo label{display:inline-flex;align-items:center;gap:6px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;padding:16px}
details{font-size:12px;color:var(--dim)}
details pre{white-space:pre-wrap;max-height:30vh;overflow:auto;margin:6px 0}
.hidden{display:none!important}
@media (max-width:1500px){.hide-narrow{display:none}}
@media (max-width:820px){.title{max-width:44vw}}
@media (prefers-reduced-motion:reduce){.prog>i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <section class="top">
    <div class="bar">
      <label class="btn primary" for="file">Open song</label>
      <input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff,.flac,.caf" hidden>
      <span id="songTitle" class="title"></span>
      <span class="grow"></span>
      <span class="label">BPM</span>
      <button id="bpmDn" title="Tempo down 0.1">−</button>
      <input id="bpm" type="number" step="0.01" min="40" max="300" inputmode="decimal">
      <button id="bpmUp" title="Tempo up 0.1">+</button>
      <button id="half" title="Half tempo">÷2</button>
      <button id="dbl" title="Double tempo">×2</button>
      <span class="seg"><button id="beatL" title="Bar lines one beat earlier">◀︎ Beat</button><button id="beatR" title="Bar lines one beat later">Beat ▶︎</button></span>
      <span class="seg"><button id="nudgeL" title="Bar lines 10 ms earlier">◀︎</button><button id="nudgeR" title="Bar lines 10 ms later">▶︎</button></span>
      <button id="barHere" title="Put a bar line at the playhead">Bar 1 here</button>
      <button id="lock" aria-pressed="false" title="Lock the tempo and bar lines">Lock</button>
    </div>
    <canvas id="overview" aria-label="Whole song: tap or drag to move the view"></canvas>
    <div id="detail">
      <canvas id="ruler" aria-label="Bar numbers: tap a bar to mark it, drag to scroll"></canvas>
      <div style="position:relative"><canvas id="wMix"></canvas><span class="tracklabel" style="top:4px">Song</span></div>
      <div style="position:relative"><canvas id="wDrums"></canvas><span class="tracklabel" style="top:4px">Drums</span></div>
    </div>
    <div class="bar">
      <div class="mixer" role="group" aria-label="Mixer">
        <span class="ch"><button id="ch-mix" aria-pressed="true">Song</button><input id="vol-mix" type="range" min="0" max="100" aria-label="Song volume"></span>
        <span class="ch"><button id="ch-drums" aria-pressed="false">Drums</button><input id="vol-drums" type="range" min="0" max="100" aria-label="Drums volume"></span>
        <span class="ch"><button id="ch-pattern" aria-pressed="false">Pattern</button><input id="vol-pattern" type="range" min="0" max="100" aria-label="Pattern volume"></span>
      </div>
      <button id="play" class="primary" style="min-width:92px">▶︎ Play</button>
      <button id="loop" class="on">Loop</button>
      <span id="selText" class="label hide-narrow"></span>
      <span class="grow"></span>
      <button id="zoomOut" title="Zoom out">−</button><button id="zoomIn" title="Zoom in">+</button>
      <button id="markSel">Mark sel.</button>
      <button id="clearMarks">Clear marks</button>
      <button id="extract" class="primary" disabled>Extract drums</button>
    </div>
    <div class="prog"><i id="prog"></i></div>
    <div id="status">Open a song to start. Everything runs on this iPad; nothing is uploaded.</div>
  </section>

  <section class="bottom">
    <div class="bar">
      <div id="tabs" class="tabs grow"></div>
      <button id="undo" disabled>Undo</button>
    </div>
    <div id="gridWrap">
      <div id="empty" class="empty">Mark up to 6 bars on the ruler (tap a bar number), then tap Extract drums.<br>Each marked bar becomes one BMY pattern.</div>
      <div id="grid" class="hidden"></div>
      <div id="gridInfo" class="gridinfo hidden">
        <label>Swing <select id="swType"><option value="Off">Off</option><option value="1-8">1/8</option><option value="1-16">1/16</option></select>
          <input id="swDepth" type="number" min="0" max="100" step="1" style="width:70px"> %</label>
        <label><input id="hatRide" type="checkbox"> Hat lane plays ride</label>
        <span id="patNotes"></span>
        <span class="grow"></span>
        <span>Tap an empty cell to add, a note to delete. Fine-tune in BMY.</span>
      </div>
    </div>
    <div class="bar">
      <span class="label">Bank</span>
      <input id="bankName" type="text" placeholder="Bank name" style="flex:1 1 220px;max-width:340px">
      <button id="export" class="primary" disabled>Export to BMY</button>
      <span class="grow"></span>
      <details><summary>Log</summary><pre id="log"></pre><button id="copyLog">Copy log</button> <a href="speedtest.html" style="color:var(--dim)">Speed test</a></details>
    </div>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
